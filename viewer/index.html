<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tweet Archive Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="archive">
  <main class="page-shell">
    <section class="archive-layout">
      <aside class="panel rail-panel">
        <div class="rail-brand">
          <span class="rail-mark">t</span>
          <div>
            <span class="eyebrow">Local Archive</span>
            <h1>Tweet Archive</h1>
          </div>
        </div>
        <p class="rail-copy">A personal archive browser with old-Twitter-inspired reading flow and modern filters.</p>
        <div class="rail-section">
          <label for="tweet-filter" class="eyebrow">Search</label>
          <input id="tweet-filter" class="filter-input" type="search" placeholder="Search tweets, people, ids">
        </div>
        <div class="filter-grid">
          <div>
            <label for="account-filter" class="eyebrow">Account</label>
            <div class="combo-filter">
              <input
                id="account-filter"
                class="filter-input"
                type="text"
                placeholder="All accounts"
                autocomplete="off"
                spellcheck="false"
                aria-autocomplete="list"
                aria-expanded="false"
                aria-controls="account-filter-options"
              >
              <div id="account-filter-options" class="combo-filter-menu" role="listbox"></div>
            </div>
          </div>
          <div>
            <label for="date-from" class="eyebrow">From</label>
            <input id="date-from" class="filter-input" type="date">
          </div>
          <div>
            <label for="date-to" class="eyebrow">To</label>
            <input id="date-to" class="filter-input" type="date">
          </div>
          <div class="filter-actions">
            <button id="clear-filters" class="clear-button" type="button">Clear filters</button>
          </div>
        </div>
        <div class="rail-section">
          <span class="eyebrow">Views</span>
          <div id="filter-chips" class="filter-chips"></div>
        </div>
        <div class="rail-section">
          <div class="status-pill" data-role="status">Loading archive...</div>
        </div>
      </aside>

      <section class="panel timeline-panel">
        <header class="timeline-header">
          <div>
            <span class="eyebrow">Timeline</span>
            <h2>Archive Feed</h2>
          </div>
          <div id="results-meta" class="results-meta"></div>
        </header>
        <div id="tweet-list" class="tweet-timeline"></div>
      </section>

      <aside class="panel detail-panel">
        <div class="detail-sticky">
          <div class="detail-header">
            <div>
              <span class="eyebrow">Archive Context</span>
              <h2>Snapshot</h2>
            </div>
          </div>
          <div id="archive-summary" class="archive-summary"></div>
          <div id="tweet-detail"></div>
        </div>
      </aside>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
